<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Карточки Ивана</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --night:#0A0F1B; --panel:#121A2B; --panel-2:#1A2438; --edge:#26324A;
  --white:#F2F5F9; --grey:#9AA8BE; --grey-2:#6C7C96; --pmuted:#6C7C96;
  --red:#DA291C; --red-dim:#8E2018; --gold:#EFBF3F;
  --grass:#1B7A4B; --grass-2:#12603A; --ok:#3FB27F;
  --disp:"Oswald","Arial Narrow",ui-sans-serif,system-ui,sans-serif;
  --ui:"Manrope",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --veil:rgba(10,15,27,.95); --shirt-empty:rgba(10,15,27,.5);
  --pitch-far:#155F3C; --pitch-near:#1E7C4E; --pitch-line:rgba(255,255,255,.6);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{
  background:var(--night);color:var(--white);
  font-family:var(--ui);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-bottom:var(--safe-b);
  user-select:none;-webkit-user-select:none;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}

/* ---- шапка ---- */
.top{position:sticky;top:0;z-index:30;background:var(--veil);backdrop-filter:blur(10px);border-bottom:1px solid var(--edge);padding-top:var(--safe-t)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:12px;padding-bottom:10px}
.brand{flex:1;min-width:0}
.brand h1{font-family:var(--disp);font-weight:600;font-size:23px;margin:0;line-height:1;letter-spacing:.03em;text-transform:uppercase}
.brand h1 span{color:var(--gold)}
.brand .who{font-size:11px;color:var(--grey-2);margin-top:3px}
.score{font-family:var(--disp);font-weight:600;font-size:12px;color:var(--grey);text-align:right;white-space:nowrap;line-height:1.2;letter-spacing:.04em}
.score b{display:block;font-size:25px;color:var(--white);font-weight:700}
.bar{height:5px;background:var(--edge);border-radius:3px;overflow:hidden;margin:13px 0 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:3px;transition:width .5s ease}

.cta{padding:15px 0 20px}
.bigbtn{
  display:block;width:100%;padding:18px 22px;border-radius:14px;background:var(--red);color:#fff;
  font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:.05em;text-transform:uppercase;text-align:center;
  box-shadow:0 3px 0 var(--red-dim),0 14px 30px -18px var(--red);transition:transform .12s ease,box-shadow .12s ease;
}
.bigbtn:active{transform:translateY(3px);box-shadow:0 0 0 var(--red-dim)}
.bigbtn small{display:block;font-family:var(--ui);font-weight:500;font-size:12.5px;letter-spacing:0;text-transform:none;color:rgba(255,255,255,.85);margin-top:5px}
.bigbtn.done{background:var(--panel);color:var(--grey);box-shadow:0 3px 0 var(--edge)}
.bigbtn.done small{color:var(--grey-2)}

.tabs{display:flex;gap:8px;padding:4px 0 14px}
.tab{flex:1;padding:10px 6px;border-radius:9px;background:var(--panel);border:1px solid var(--edge);
  font-family:var(--disp);font-size:13px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--grey);text-align:center}
.tab.on{background:var(--red);border-color:var(--red);color:#fff}

/* ---- этапы ---- */
.stage{background:var(--panel);border:1px solid var(--edge);border-radius:13px;padding:15px 16px 14px;margin-bottom:10px}
.stage.cur{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 16px 34px -24px var(--red)}
.stage.locked{opacity:.5}
.sthead{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-bottom:5px}
.stno{grid-column:1/-1;font-family:var(--disp);font-size:10.5px;font-weight:600;letter-spacing:.14em;color:var(--grey-2);text-transform:uppercase}
.stname{font-family:var(--disp);font-size:18px;font-weight:600;letter-spacing:.02em;line-height:1.15;text-transform:uppercase}
.stprog{font-family:var(--disp);font-size:13px;font-weight:500;color:var(--grey-2);white-space:nowrap;align-self:center}
.stwhat{font-size:12px;color:var(--grey-2);margin:0 0 11px}
.pills{display:grid;grid-template-columns:repeat(20,1fr);gap:2.5px}
.pl{height:9px;border-radius:2px;background:var(--edge)}
.pl.done{background:var(--ok)}
.pl.now{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.streward{font-size:11.5px;color:var(--gold);margin:9px 0 0;font-family:var(--disp);letter-spacing:.05em;text-transform:uppercase}
.trophy{margin:16px 0 34px;padding:24px 20px;border-radius:14px;text-align:center;
  background:linear-gradient(160deg,var(--panel-2),var(--panel));border:1px solid var(--edge)}
.trophy .tw{font-size:42px;line-height:1;margin-bottom:10px}
.trophy h3{font-family:var(--disp);font-size:20px;margin:0 0 6px;letter-spacing:.04em;text-transform:uppercase;color:var(--gold)}
.trophy p{margin:0;font-size:13px;color:var(--grey-2)}

/* ---- поле и состав ---- */
.pitch{position:relative;margin:2px 0 16px;border-radius:14px;overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--grass) 0 26px,var(--grass-2) 26px 52px);
  border:1px solid var(--edge);aspect-ratio:3/4}
.pitch .lines{position:absolute;inset:0}
.pitch .lines i{position:absolute;border:2px solid rgba(255,255,255,.2)}
.ln-out{inset:9px}
.ln-mid{left:9px;right:9px;top:50%;height:0;border-width:0 0 2px 0!important}
.ln-circle{left:50%;top:50%;width:23%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%}
.ln-box-t{left:23%;right:23%;top:9px;height:13%}
.ln-box-b{left:23%;right:23%;bottom:9px;height:13%}
.slot{position:absolute;transform:translate(-50%,-50%);text-align:center;width:70px}
.shirt{width:36px;height:36px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-weight:700;font-size:14px;
  background:var(--shirt-empty);border:2px dashed rgba(255,255,255,.28);color:rgba(255,255,255,.4)}
.slot.got .shirt{background:var(--red);border:2px solid #fff;color:#fff}
.slot .nm{font-size:10px;line-height:1.15;color:rgba(255,255,255,.5);font-weight:700}
.slot.got .nm{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.bench{margin-bottom:14px}
.bench h4{font-family:var(--disp);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--grey-2);margin:0 0 9px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px}
.pcard{background:var(--panel);border:1px solid var(--edge);border-radius:9px;padding:9px 8px;text-align:center;min-height:66px;
  display:flex;flex-direction:column;justify-content:center;gap:3px}
.pcard.got{border-color:var(--gold)}
.pcard .rk{font-family:var(--disp);font-size:9.5px;letter-spacing:.1em;color:var(--grey-2)}
.pcard .nn{font-size:11px;font-weight:700;line-height:1.2;color:var(--grey-2)}
.pcard.got .nn{color:var(--white)}
.pcard .pp{font-size:9.5px;color:var(--grey-2)}
.nextup{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:14px 16px;margin-bottom:30px}
.nextup h4{font-family:var(--disp);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--grey-2);margin:0 0 7px}
.nextup p{margin:0;font-size:14px;color:var(--grey)}
.nextup p b{color:var(--white)}

/* ---- выбор задания ---- */
.picker{position:fixed;inset:0;z-index:55;background:var(--night);display:flex;flex-direction:column;padding-top:var(--safe-t)}
.picker .ph{padding:22px 18px 8px;text-align:center}
.picker .ph h2{font-family:var(--disp);font-size:22px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.03em}
.picker .ph p{margin:0;font-size:13.5px;color:var(--grey-2)}
.opts{flex:1;display:flex;flex-direction:column;justify-content:center;gap:11px;padding:10px 18px 24px;max-width:460px;margin:0 auto;width:100%}
.opt{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:17px 18px;text-align:left}
.opt.main{background:var(--red);border-color:var(--red);box-shadow:0 3px 0 var(--red-dim)}
.opt:active{transform:translateY(2px)}
.opt .oh{display:block;font-family:var(--disp);font-size:18px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.03em}
.opt .op{display:block;margin:0;font-size:13px;color:var(--grey)}
.opt.main .op{color:rgba(255,255,255,.88)}
.opt .tagline{display:inline-block;margin-top:7px;font-family:var(--disp);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  padding:2px 8px;border-radius:20px;border:1px solid var(--edge);color:var(--grey-2)}
.opt.main .tagline{border-color:rgba(255,255,255,.45);color:#fff}
.backlink{display:block;text-align:center;padding:12px;font-size:13.5px;color:var(--grey-2)}

/* ---- матч ---- */
.sess{position:fixed;inset:0;z-index:60;background:var(--night);display:flex;flex-direction:column;padding-top:var(--safe-t)}
.sesstop{padding:12px 16px 8px;display:flex;align-items:center;gap:12px}
.pips{display:flex;gap:6px;flex:1}
.pip{height:5px;flex:1;border-radius:3px;background:var(--edge)}
.pip.on{background:var(--grey-2)}
.pip.cur{background:var(--gold)}
.quit{font-size:12px;color:var(--grey-2);padding:6px 10px;border-radius:8px}
.sessbody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:8px 18px 4px;overflow-y:auto;gap:0}
.sessbody .phase{margin-top:10px}
.phase{font-family:var(--disp);font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  color:var(--grey-2);margin:0 0 10px;text-align:center;flex:none}
.board{border:1px solid var(--edge);border-radius:12px;background:var(--panel);padding:clamp(10px,2vh,18px) 24px;
  margin-bottom:2px;min-width:min(320px,86vw);flex:none}
.board .ctx{font-size:12px;color:var(--grey-2);text-align:center;margin:0 0 8px}
.expr{font-family:var(--disp);font-weight:600;font-size:clamp(28px,8vw,52px);text-align:center;line-height:1.05;margin:0;letter-spacing:.02em}
.qtext{font-size:clamp(15.5px,4.1vw,19px);line-height:1.42;text-align:center;max-width:27ch;margin:0 auto 8px;flex:none}
.answer{font-family:var(--disp);font-weight:700;font-size:clamp(28px,7.4vw,44px);min-height:1.1em;text-align:center;
  color:var(--gold);border-bottom:3px solid var(--edge);min-width:2.6em;padding:0 14px 2px;
  margin:clamp(4px,1.4vh,12px) auto 2px;display:block;letter-spacing:.05em;flex:none}
.answer.empty::after{content:"?";color:var(--edge)}
.answer.shake{animation:sh .4s ease}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.msg{min-height:20px;text-align:center;font-size:13.5px;color:var(--grey);margin:4px 0 0;max-width:30ch;flex:none}
.msg.good{color:var(--ok);font-weight:700}
.hintbox{background:var(--panel);border-left:3px solid var(--gold);padding:10px 14px;border-radius:0 10px 10px 0;
  margin:9px auto 0;max-width:31ch;font-size:13.5px;line-height:1.45;color:var(--grey);text-align:left;flex:none}
.hintbox b{color:var(--white)}
.pad{flex:0 0 auto;padding:6px 12px calc(10px + var(--safe-b));display:grid;grid-template-columns:repeat(3,1fr);
  gap:7px;max-width:400px;margin:0 auto;width:100%}
.key{height:clamp(42px,6.4vh,56px);border-radius:11px;background:var(--panel);border:1px solid var(--edge);
  font-family:var(--disp);font-weight:600;font-size:22px;color:var(--white);display:flex;align-items:center;justify-content:center;transition:transform .08s ease}
.key:active{transform:scale(.94);background:var(--panel-2)}
.key.ok{background:var(--ok);border-color:var(--ok);font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.key.del{color:var(--grey)}
.disc{max-width:34ch;margin:0 auto;text-align:left}
.disc .dh{font-family:var(--disp);font-size:22px;line-height:1.15;margin:0 0 12px;color:var(--gold);text-transform:uppercase;letter-spacing:.03em}
.disc p{font-size:15.5px;line-height:1.6;color:var(--grey);margin:0 0 12px}
.disc p b{color:var(--white);font-weight:700}
.contbtn{margin:20px auto 0;display:block;padding:15px 34px;border-radius:12px;background:var(--white);color:var(--night);
  font-family:var(--disp);font-weight:600;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.contbtn:active{transform:translateY(2px)}
.contbtn.ghost{margin-top:10px;background:transparent;color:var(--grey);border:1px solid var(--edge);
  box-shadow:none;font-size:14px;padding:12px 26px}

/* ---- финал ---- */
.done-screen{text-align:center;max-width:31ch;margin:0 auto}
.matchbadge{width:118px;height:118px;margin:0 auto 18px;border-radius:50%;border:3px solid var(--gold);color:var(--gold);
  display:flex;flex-direction:column;align-items:center;justify-content:center;animation:drop .5s cubic-bezier(.2,1.4,.5,1) both}
@keyframes drop{0%{transform:scale(2.1);opacity:0}100%{transform:scale(1);opacity:1}}
.matchbadge .mn{font-family:var(--disp);font-weight:700;font-size:42px;line-height:1}
.matchbadge .ml{font-family:var(--disp);font-size:9.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;margin-top:4px}
.done-screen h2{font-family:var(--disp);font-size:25px;margin:0 0 9px;text-transform:uppercase;letter-spacing:.03em}
.done-screen p{font-size:14.5px;color:var(--grey);margin:0 0 8px}
.newplayer{margin:16px auto 0;padding:17px;border-radius:13px;max-width:300px;background:var(--panel);border:1px solid var(--gold);
  animation:drop .45s cubic-bezier(.2,1.4,.5,1) both}
.newplayer .np{font-family:var(--disp);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
.newplayer h3{font-family:var(--disp);font-size:20px;margin:0 0 3px;text-transform:uppercase;letter-spacing:.02em}
.newplayer .pos{font-size:11.5px;color:var(--grey-2);margin:0 0 9px}
.newplayer p{font-size:13px;color:var(--grey);margin:0;line-height:1.5}

/* ---- родителю ---- */
.parent{position:fixed;inset:0;z-index:80;background:var(--night);overflow-y:auto;padding:var(--safe-t) 0 40px}
.ptop{display:flex;align-items:center;gap:12px;padding:16px 0 12px;border-bottom:1px solid var(--edge)}
.ptop h2{font-family:var(--disp);font-size:18px;margin:0;flex:1;text-transform:uppercase;letter-spacing:.03em}
.pclose{font-size:13px;color:var(--grey);padding:8px 12px;border-radius:8px;background:var(--panel)}
.pcode{max-width:270px;margin:70px auto;text-align:center}
.pcode input{font-family:var(--disp);font-size:28px;text-align:center;letter-spacing:.4em;width:100%;padding:12px;
  border:2px solid var(--edge);border-radius:12px;background:var(--panel);color:var(--white)}
.pcode p{font-size:14px;color:var(--grey)}
.pstats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:16px 0}
@media (min-width:520px){.pstats{grid-template-columns:repeat(4,1fr)}}
.pstat{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:13px}
.pstat b{display:block;font-family:var(--disp);font-size:24px;font-weight:700;line-height:1}
.pstat span{font-size:11px;color:var(--grey-2);display:block;margin-top:5px;line-height:1.3}
.phead{font-family:var(--disp);font-size:11.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--grey-2);margin:24px 0 9px}
.prow{display:grid;grid-template-columns:70px 1fr auto;gap:11px;align-items:center;padding:10px 0;border-bottom:1px solid var(--edge);font-size:13.5px}
.prow .pd{font-family:var(--disp);font-size:12px;color:var(--grey-2)}
.prow .pt i{font-style:normal;color:var(--grey-2);font-size:12px;display:block}
.pill{font-family:var(--disp);font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;letter-spacing:.05em;text-transform:uppercase}
.pill.ok{background:#12332a;color:#5FCFA0}
.pill.hint{background:#33290F;color:var(--gold)}
.pill.shown{background:#33191A;color:#E8837A}
.psync{font-size:12px;color:var(--grey-2);margin-top:20px;line-height:1.6;border-top:1px solid var(--edge);padding-top:14px}
.pbtns{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.pbtn{padding:10px 15px;border-radius:10px;background:var(--panel);border:1px solid var(--edge);font-size:13px}
.hidden{display:none!important}
.boot{padding:80px 20px;text-align:center;color:var(--grey-2);font-family:var(--disp);letter-spacing:.1em;text-transform:uppercase;font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:700px){.key{height:62px;font-size:24px}.pitch{aspect-ratio:4/5}}

/* ---- строка недели ---- */
.wkrow{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:0 0 16px}
.wcell{background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:8px 6px;text-align:center;min-width:0}
.wcell.now{background:var(--red);border-color:var(--red)}
.wcell .wd{display:block;font-family:var(--disp);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey-2);margin-bottom:3px}
.wcell.now .wd{color:rgba(255,255,255,.85)}
.wcell .wn{display:block;font-family:var(--disp);font-size:11px;font-weight:500;line-height:1.15;color:var(--grey);
  text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcell.now .wn{color:#fff}
.pill.none{background:var(--panel-2);color:var(--grey-2)}
.qtext{max-width:28ch}

/* ============================================================
   ПОЛЕ ЗАНЯТИЯ: мяч идёт к воротам
   ============================================================ */
.strip{
  position:relative;width:100%;max-width:340px;margin:0 auto 4px;
  height:clamp(100px,17vh,180px);border-radius:12px;overflow:hidden;
  background:linear-gradient(180deg,var(--pitch-far) 0%,var(--pitch-near) 100%);
  border:1px solid var(--edge);flex:none;
}
.strip .mark{position:absolute;border:2px solid var(--pitch-line)}
.strip .goalframe{left:26%;right:26%;top:0;height:13%;border-top:0;border-radius:0 0 3px 3px}
.strip .goalnet{
  position:absolute;left:26%;right:26%;top:0;height:13%;
  background:repeating-linear-gradient(90deg,var(--pitch-line) 0 1px,transparent 1px 9px),
             repeating-linear-gradient(180deg,var(--pitch-line) 0 1px,transparent 1px 9px);
  opacity:.5;
}
.strip .box{left:11%;right:11%;top:0;height:30%;border-top:0}
.strip .arc{
  left:50%;top:30%;width:34%;aspect-ratio:2/1;transform:translate(-50%,-50%);
  border-radius:0 0 999px 999px;border-top:0;
}
.yard{position:absolute;left:9%;right:9%;height:0;border-top:1px dashed var(--pitch-line);opacity:.4}
.yard.passed{opacity:.85;border-top-style:solid;border-color:var(--ok)}
.ball{
  position:absolute;left:50%;width:22px;height:22px;margin-left:-11px;border-radius:50%;
  background:radial-gradient(circle at 35% 32%, #fff 0 42%, #E8ECEF 45%, #C9D2D8 100%);
  box-shadow:0 3px 8px rgba(0,0,0,.45), inset 0 -3px 5px rgba(0,0,0,.14);
  transition:bottom .5s cubic-bezier(.22,.9,.3,1), transform .5s cubic-bezier(.22,.9,.3,1);
  z-index:3;
}
.ball::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, #2A2F36 0 22%, transparent 23%);
  opacity:.75;
}
.strip.scored .ball{transform:scale(1.18)}
.strip .goalword{
  position:absolute;left:0;right:0;top:34%;text-align:center;
  font-family:var(--disp);font-weight:700;font-size:30px;letter-spacing:.14em;
  color:var(--gold);text-shadow:0 2px 12px rgba(0,0,0,.55);
  opacity:0;transform:scale(.7);transition:opacity .35s ease,transform .45s cubic-bezier(.2,1.5,.4,1);
  pointer-events:none;
}
.strip.scored .goalword{opacity:1;transform:scale(1)}
.strip .pen{
  position:absolute;left:50%;width:7px;height:7px;margin-left:-3.5px;bottom:34%;
  border-radius:50%;background:var(--pitch-line);opacity:.75;
}
.strip .cnt{
  position:absolute;right:9px;bottom:7px;font-family:var(--disp);font-size:11px;
  letter-spacing:.1em;color:var(--pitch-line);opacity:.9;
}
@media (prefers-reduced-motion:reduce){
  .ball{transition:none} .strip .goalword{transition:none}
}

/* ============================================================
   ПУТЬ: маршрут вместо восьми одинаковых карточек
   ============================================================ */
.route{margin:2px 0 26px}
.rw{display:grid;grid-template-columns:26px 1fr;gap:13px;position:relative}
.rw + .rw{margin-top:2px}
.rail{position:relative;display:flex;flex-direction:column;align-items:center}
.rail::before{
  content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--edge);
}
.rw:first-child .rail::before{top:13px}
.rw:last-child .rail::before{bottom:calc(100% - 13px)}
.rail.done::before{background:var(--ok)}
.node{
  position:relative;z-index:2;width:26px;height:26px;border-radius:50%;flex:none;margin-top:1px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-weight:700;font-size:12px;
  background:var(--panel);border:2px solid var(--edge);color:var(--grey-2);
}
.node.done{background:var(--ok);border-color:var(--ok);color:#08130E}
.node.now{
  background:var(--gold);border-color:var(--gold);color:#3A2B06;
  box-shadow:0 0 0 0 rgba(239,191,63,.6);animation:nodepulse 2.6s ease-out infinite;
}
@keyframes nodepulse{0%{box-shadow:0 0 0 0 rgba(239,191,63,.55)}70%{box-shadow:0 0 0 11px rgba(239,191,63,0)}100%{box-shadow:0 0 0 0 rgba(239,191,63,0)}}
.rbody{padding:0 0 16px}
.rw:last-child .rbody{padding-bottom:0}
.rtop{display:flex;align-items:baseline;gap:9px;flex-wrap:nowrap}
.rtop .rname{min-width:0;overflow-wrap:anywhere}
.rname{
  font-family:var(--disp);font-size:15.5px;font-weight:600;text-transform:uppercase;
  letter-spacing:.02em;line-height:1.15;color:var(--grey)
}
.rw.done .rname{color:var(--white)}
.rw.now .rname{font-size:19px;color:var(--white)}
.rw.locked .rname{color:var(--grey-2)}
.rcount{font-family:var(--disp);font-size:12px;color:var(--grey-2);white-space:nowrap;margin-left:auto}
.rwhat{font-size:12.5px;color:var(--grey-2);margin:3px 0 0}
.rw.now .rwhat{margin-bottom:10px}
.rprize{font-family:var(--disp);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--gold);margin:5px 0 0}
.rw.locked .rprize{color:var(--grey-2)}
.rpills{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;margin:2px 0 8px}
.rpills .pl{height:10px}
.rnow{
  background:var(--panel);border:1px solid var(--gold);border-radius:11px;padding:13px 14px;margin-top:2px;
}

/* очень низкий экран: поле уходит в тонкую полосу */
@media (max-height:660px){
  .strip{height:92px}
  .strip .goalword{font-size:22px}
  .sessbody .phase{margin-top:4px;margin-bottom:6px}
  .key{height:clamp(38px,6vh,48px);font-size:20px}
}
@media (max-height:560px){
  .strip{display:none}
}


/* ---------- отметка о сделанном дне ---------- */
.dayflag{font-family:var(--disp);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--grey-2);text-align:center;margin:0 0 10px}
.dayflag.ok{color:var(--ok)}
.dayflag.ok::before{content:"\2713 \00a0"}

/* ---------- сверхплановые тренировки ---------- */
.trbar{background:var(--panel);border:1px solid var(--edge);border-radius:14px;
  padding:12px 14px 13px;margin:0 0 16px}
.trtop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.trtop span{font-family:var(--disp);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey-2)}
.trtop b{font-family:var(--disp);font-size:26px;line-height:1;color:var(--white)}
.trp{margin:2px 0 0;font-size:12.5px;color:var(--grey)}
.trnext{margin:6px 0 0;font-size:12px;color:var(--grey-2)}
.trmarks{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px;font-size:15px;line-height:1}
.trmarks i{font-style:normal;opacity:.92}

/* ---------- разделитель в меню занятия ---------- */
.opsep{font-family:var(--disp);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--grey-2);text-align:center;margin:6px 0 -2px}
.picker .opts{justify-content:flex-start;padding:4px 18px 14px;overflow-y:auto;min-height:0;flex:1 1 auto;gap:9px}
.picker .backlink{flex:0 0 auto}
.picker .opt{padding:13px 16px}
.picker .opt .oh{font-size:17px;margin-bottom:3px}
.picker .opt .op{font-size:12.5px;line-height:1.38}
@media (max-height:700px){
  .picker .ph{padding:14px 18px 4px}
  .picker .ph h2{font-size:19px}
  .picker .opt{padding:11px 15px}
  .picker .opt .oh{font-size:16px}
}
/* тёмная тема — единственная, как у стадиона */
:root{color-scheme:dark}
/* ============================================================
   «Карточки» — коллекция игроков за уровни
   ============================================================ */

/* ---------- карточка в раскладке EA FC 24–26 ----------
   Слева сверху рейтинг и позиция, фото крупно, имя, шесть характеристик в ряд,
   внизу флаг и клуб. Координаты — в процентах карточки, em — только размер шрифта;
   размер всей карточки задаёт одна переменная --w. */
.fut{
  --w:230px; --c1:#F6E27A; --c2:#D9A520; --c3:#9C6F0E; --ink:#3A2A06; --ink2:rgba(58,42,6,.72);
  position:relative;width:var(--w);aspect-ratio:23/33;font-size:calc(var(--w) / 23);
  clip-path:polygon(11% 0,89% 0,100% 4.5%,100% 87%,50% 100%,0 87%,0 4.5%);
  background:
    radial-gradient(120% 70% at 70% 15%, rgba(255,255,255,.55), transparent 55%),
    linear-gradient(165deg,var(--c1) 0%,var(--c2) 50%,var(--c3) 100%);
  color:var(--ink);font-family:var(--disp);flex:none;
}
.fut::after{ /* внутренняя рамка */
  content:"";position:absolute;inset:.5em;pointer-events:none;
  clip-path:inherit;border:.14em solid rgba(255,255,255,.5);
}
.fut .fo{position:absolute;left:8%;top:9%;width:23%;text-align:center;font-size:3.4em;font-weight:700;line-height:.9;z-index:2}
.fut .fp{position:absolute;left:8%;top:21%;width:23%;text-align:center;font-size:1.35em;font-weight:600;letter-spacing:.04em;line-height:1;z-index:2}
.fut .fph{position:absolute;right:3%;top:4%;width:70%;aspect-ratio:1;overflow:hidden}
.fut .fph img{width:100%;height:100%;object-fit:cover;object-position:50% 15%;
  -webkit-mask-image:linear-gradient(180deg,#000 74%,transparent 100%);mask-image:linear-gradient(180deg,#000 74%,transparent 100%)}
.fut .fph svg{width:100%;height:100%;display:block}
.fut .fn{position:absolute;left:0;right:0;top:51.5%;text-align:center;font-size:1.95em;font-weight:700;
  text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 9%;line-height:1.1}
.fut .fs{position:absolute;left:7%;right:7%;top:61%;display:grid;grid-template-columns:repeat(6,1fr);text-align:center}
.fut .fs div{display:flex;flex-direction:column;align-items:center;line-height:1.05}
.fut .fs span{font-size:.72em;font-weight:500;opacity:.85;letter-spacing:.02em}
.fut .fs b{font-size:1.45em;font-weight:700}
.fut .fb{position:absolute;left:20%;right:20%;top:74%;padding-top:2.5%;border-top:.1em solid var(--ink2);
  display:flex;align-items:center;justify-content:center;gap:1.1em}
.fut .ff{font-size:1.7em;line-height:1}
.fut .fc{width:2.6em;height:2.6em;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:.82em;font-weight:700;letter-spacing:0;background:rgba(255,255,255,.35);border:.12em solid var(--ink2);color:var(--ink)}
.fut .ft{position:absolute;left:0;right:0;bottom:5.5%;text-align:center;font-size:.72em;letter-spacing:.2em;
  text-transform:uppercase;font-weight:600;color:var(--ink2)}
/* поле «прилетело» в карточку */
.fut .pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(1.7);filter:brightness(1.6)}100%{transform:scale(1);filter:none}}

/* редкость */
.fut.t-silver{--c1:#F1F3F5;--c2:#BCC4CC;--c3:#7D8894;--ink:#1E252D;--ink2:rgba(30,37,45,.7)}
.fut.t-gold{}
.fut.t-rare{--c1:#FFF0A0;--c2:#F2C230;--c3:#B07A06}
.fut.t-rare::before,.fut.t-top::before,.fut.t-icon::before{ /* блик */
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);
  background-size:250% 100%;animation:shine 3.8s ease-in-out infinite;
}
@keyframes shine{0%{background-position:130% 0}60%,100%{background-position:-60% 0}}
.fut.t-top{--c1:#2B2F3A;--c2:#15181F;--c3:#06070A;--ink:#F3CF5C;--ink2:rgba(243,207,92,.7);
  background:
    radial-gradient(90% 60% at 70% 20%, rgba(243,207,92,.28), transparent 60%),
    repeating-linear-gradient(135deg,rgba(243,207,92,.06) 0 .5em,transparent .5em 1.4em),
    linear-gradient(160deg,var(--c1),var(--c2) 55%,var(--c3))}
.fut.t-top .fc{background:rgba(243,207,92,.12)}
.fut.t-icon{--c1:#FFFDF4;--c2:#EDE2C0;--c3:#C7A75A;--ink:#4A3A12;--ink2:rgba(74,58,18,.7)}

/* мини-карточка */
.fut.mini{--w:100px}
.fut.mini .fs,.fut.mini .fb,.fut.mini .ft{display:none}
.fut.mini .fn{top:57%;font-size:2.5em;padding:0 6%}
.fut.mini .fo{font-size:3.9em}
.fut.mini .fp{font-size:1.65em;top:22%}
.fut.mini .fph{width:70%;right:2%}
.fut.lock{background:linear-gradient(160deg,#1E2737,#121A2B);color:var(--grey-2)}
.fut.lock::after{border-color:rgba(255,255,255,.08)}
.fut.lock .q{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4em}
.fut.lock .q b{font-size:6em;line-height:1;color:var(--edge)}
.fut.lock .q span{font-size:1.6em;letter-spacing:.15em}

/* ---------- главная ---------- */
.hero{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:14px;margin:14px 0 12px}
.hero .hx{flex:1;min-width:0}
.hero .hk{font-family:var(--disp);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey-2)}
.hero .hn{font-family:var(--disp);font-size:34px;font-weight:700;line-height:1;margin:2px 0 4px}
.hero .hn small{display:block;font-size:13px;color:var(--grey-2);font-weight:500;letter-spacing:.06em;margin-top:4px}
.hero p{margin:0;font-size:13px;color:var(--grey)}
.hero .packmini{width:62px;height:84px;flex:none;border-radius:10px;
  background:linear-gradient(160deg,#F6E27A,#D9A520 55%,#9C6F0E);box-shadow:0 0 22px -4px rgba(239,191,63,.7);
  display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;color:#3A2A06;font-size:22px}

/* карта уровней */
.lvstage{margin:0 0 18px}
.lvhead{display:flex;align-items:baseline;gap:10px;margin:0 0 8px}
.lvhead b{font-family:var(--disp);font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.lvhead span{font-size:12px;color:var(--grey-2)}
.lvhead i{margin-left:auto;font-style:normal;font-family:var(--disp);font-size:12px;color:var(--grey-2)}
.lvstage.locked .lvhead b{color:var(--grey-2)}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.lv{aspect-ratio:1;border-radius:11px;background:var(--panel);border:1px solid var(--edge);
  font-family:var(--disp);font-weight:600;font-size:17px;color:var(--grey-2);display:flex;align-items:center;justify-content:center;position:relative}
.lv.done{background:#12332a;border-color:#1f5a46;color:#5FCFA0}
.lv.done::after{content:"✓";position:absolute;right:6px;top:3px;font-size:11px}
.lv.now{background:var(--gold);border-color:var(--gold);color:#3A2B06;animation:nodepulse 2.6s ease-out infinite}
.lv.lock{opacity:.45}

/* ---------- открытие пака ---------- */
.reveal{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-bottom:16px}
.reveal h2{font-family:var(--disp);font-size:24px;margin:0;text-transform:uppercase;letter-spacing:.03em}
.reveal .sub{font-size:14px;color:var(--grey);margin:0 0 10px}
.pack{width:190px;aspect-ratio:23/33;border-radius:16px;cursor:pointer;position:relative;
  background:
    radial-gradient(80% 50% at 50% 30%, rgba(255,255,255,.55), transparent 70%),
    linear-gradient(160deg,#F6E27A,#D9A520 55%,#9C6F0E);
  box-shadow:0 0 50px -6px rgba(239,191,63,.75);animation:packbob 1.8s ease-in-out infinite;
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#3A2A06;font-family:var(--disp)}
.pack b{font-size:44px;line-height:1}
.pack span{font-size:13px;letter-spacing:.18em;text-transform:uppercase;margin-top:8px}
@keyframes packbob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
.pack.open{animation:packout .45s ease-in forwards}
@keyframes packout{to{transform:scale(1.25);opacity:0;filter:brightness(2)}}
.cardin{animation:cardin .75s cubic-bezier(.2,1.3,.4,1) both}
@keyframes cardin{0%{transform:perspective(700px) rotateY(90deg) scale(.6);opacity:0}100%{transform:perspective(700px) rotateY(0) scale(1);opacity:1}}
.tierword{font-family:var(--disp);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:4px 0 0}
.fact{max-width:32ch;font-size:14px;line-height:1.5;color:var(--grey);margin:6px auto 0}
.glow-top{filter:drop-shadow(0 0 22px rgba(243,207,92,.65))}
.glow-icon{filter:drop-shadow(0 0 26px rgba(255,250,230,.75))}
.glow-rare{filter:drop-shadow(0 0 18px rgba(239,191,63,.55))}

/* ---------- коллекция ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 12px}
.chip{padding:7px 12px;border-radius:20px;background:var(--panel);border:1px solid var(--edge);
  font-family:var(--disp);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey)}
.chip.on{background:var(--white);border-color:var(--white);color:var(--night)}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px 8px;justify-items:center;margin-bottom:30px}
.coll .fut{cursor:pointer}
.collcount{font-family:var(--disp);font-size:13px;color:var(--grey-2);margin:0 0 6px}

/* ---------- состав ---------- */
.forms{display:flex;gap:6px;overflow-x:auto;margin:2px 0 10px;padding-bottom:2px}
.forms .chip{flex:none}
.xi{position:relative;margin:0 0 12px;border-radius:14px;overflow:hidden;aspect-ratio:3/4;
  background:repeating-linear-gradient(180deg,var(--grass) 0 9%,var(--grass-2) 9% 18%);border:1px solid var(--edge)}
.xi .lines{position:absolute;inset:0}
.xi .lines i{position:absolute;border:2px solid rgba(255,255,255,.2)}
.xs{position:absolute;transform:translate(-50%,-50%);width:19%;text-align:center;cursor:pointer}
.xs .xe{width:min(15vw,88px);margin:0 auto;aspect-ratio:23/33;border-radius:8px;border:2px dashed rgba(255,255,255,.35);
  background:rgba(10,15,27,.35);display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-size:20px;color:rgba(255,255,255,.55)}
.xs .fut{--w:min(15vw,88px);margin:0 auto}
.xs .fut .fp{display:none}
.xs .fut .fo{font-size:4.6em;left:4%;top:8%;width:30%}
.xs .fut .fph{width:74%;right:1%;top:10%}
.xs .fut .fn{font-size:3.4em;top:60%;padding:0 4%}
.xs .xl{font-family:var(--disp);font-size:10px;letter-spacing:.08em;color:rgba(255,255,255,.75);margin-top:2px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.xsum{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:12px 14px;margin:0 0 30px}
.xsum b{font-family:var(--disp);font-size:28px;line-height:1}
.xsum span{font-size:13px;color:var(--grey);flex:1}
.xsum.ready{border-color:var(--gold)}
.xsum.ready b{color:var(--gold)}

/* выбор игрока на позицию */
.sheet{position:fixed;inset:0;z-index:70;background:rgba(5,8,14,.7);display:flex;align-items:flex-end;justify-content:center}
.sheetin{background:var(--night);border-top:1px solid var(--edge);border-radius:18px 18px 0 0;width:100%;max-width:620px;
  max-height:78vh;overflow-y:auto;padding:16px 16px calc(20px + var(--safe-b))}
.sheetin h3{font-family:var(--disp);font-size:17px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.03em}
.sheetin .sp{font-size:13px;color:var(--grey-2);margin:0 0 12px}
.sheetin .coll{margin-bottom:12px}
.sheetin .fut.used{opacity:.35}

/* карточка крупно */
.cardview{position:fixed;inset:0;z-index:75;background:rgba(5,8,14,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px 16px;gap:10px;overflow-y:auto}
.cardview .fut{--w:min(250px,64vw)}
.cardview .cvn{font-family:var(--disp);font-size:20px;text-transform:uppercase;margin:6px 0 0;text-align:center}
.cardview .cvc{font-size:13px;color:var(--grey-2);margin:0;text-align:center}

/* ---------- родителю: фото ---------- */
.prow2{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--edge);font-size:13.5px}
.prow2 .th{width:44px;height:44px;border-radius:8px;background:var(--panel);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--grey-2);font-size:11px}
.prow2 .th img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.prow2 i{font-style:normal;color:var(--grey-2);font-size:12px;display:block}
.prow2 label,.prow2 button{padding:7px 11px;border-radius:9px;background:var(--panel);border:1px solid var(--edge);font-size:12px;cursor:pointer;white-space:nowrap}
.prow2 .acts{display:flex;gap:6px}

/* ---------- моя карточка ---------- */
.meform{padding-block:18px 40px}
.meform h2{font-family:var(--disp);font-size:26px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.03em}
.meform .sub{font-size:14px;color:var(--grey);margin:0 0 14px}
.mepreview{display:flex;justify-content:center;margin:4px 0 14px}
.mepreview .fut{--w:min(220px,60vw)}
.mf{display:block;font-family:var(--disp);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey-2);margin:16px 0 8px}
.mi{width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--edge);background:var(--panel);color:var(--white);
  font-family:var(--ui);font-size:16px;margin-bottom:6px}
.mi:focus{outline:2px solid var(--gold);outline-offset:1px}
.mh{font-size:12.5px;color:var(--grey-2);margin:-4px 0 6px}
.meform .chips{margin-bottom:6px}
.mephoto{display:inline-block;cursor:pointer;margin-bottom:8px}
.meform .bigbtn{margin-top:22px}
.meform .bigbtn:disabled{opacity:.45;box-shadow:none}

/* ---------- загрузочный экран ---------- */
#splash{position:fixed;inset:0;z-index:200;background:var(--night);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;transition:opacity .35s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .spin{width:64px;height:64px;animation:sbounce 1s ease-in-out infinite}
#splash .sball{display:block;width:64px;height:64px;border-radius:50%;
  background:radial-gradient(circle at 35% 32%,#fff 0 40%,#E8ECEF 44%,#BFC8CF 100%);
  box-shadow:0 10px 24px rgba(0,0,0,.5);position:relative;animation:sroll 1.2s linear infinite}

/* ============================================================

/* ============================================================
   ДВИЖОК ЗАНЯТИЯ
   ============================================================ */
function stageOf(st){ return Math.min(STAGES.length-1, Math.floor(st/STEPS_PER_STAGE)); }
function posOf(st){ return st % STEPS_PER_STAGE; }

function shuffle(a, r){
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(r()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

/* Берём сначала то, чего давно не было, потом остальное. */
function pickN(pool, count, seed, avoid){
  var r = rng(seed), fresh = [], stale = [], i;
  for(i=0;i<pool.length;i++){
    if(avoid && avoid[pool[i].q]) stale.push(pool[i]); else fresh.push(pool[i]);
  }
  shuffle(fresh, r); shuffle(stale, r);
  var all = fresh.concat(stale), out = [];
  for(i=0;i<count && i<all.length;i++) out.push(all[i]);
  return out;
}
function taskAt(stage, idx){ return TASKS[stage][idx % TASKS[stage].length]; }

/* пул из всех пройденных этапов */
function poolUpTo(bank, stage){
  var out = [];
  for(var i=0;i<=stage;i++) out = out.concat(bank[i]);
  return out;
}

/* пул примеров вперемешку из всех пройденных этапов */
function mixedWarm(step, count, seed, avoid){
  var top = stageOf(step), r = rng(seed), out = [], seen = {}, guard = 0;
  while(out.length < count && guard < 600){
    guard++;
    var s = Math.floor(r()*(top+1));
    var w = WARMUP[s](r);
    if(seen[w.q]) continue;
    if(avoid && avoid[w.q] && guard < 300) continue;
    seen[w.q] = 1; out.push(w);
  }
  return out;
}

/* задача из всех пройденных этапов, с оглядкой на недавние */
function pickTask(stage, seed, avoid){
  var all = [], i, j;
  for(i=0;i<=stage;i++) for(j=0;j<TASKS[i].length;j++) all.push({s:i, i:j});
  var r = rng(seed), fresh = [], stale = [];
  for(i=0;i<all.length;i++){
    var q = TASKS[all[i].s][all[i].i].q;
    if(avoid && avoid[q]) stale.push(all[i]); else fresh.push(all[i]);
  }
  shuffle(fresh, r); shuffle(stale, r);
  return fresh.concat(stale)[0];
}

/* Один день.
   kind  — вид тренировки
   defer — отложенная задача или null
   opts  — {seed, avoid, broad, n}: broad = свободная тренировка,
           берём из всех пройденных этапов и не повторяем недавнее */
function buildDay(step, kind, defer, opts){
  opts = opts || {};
  var stage = stageOf(step), pos = posOf(step);
  var seed = (opts.seed != null) ? opts.seed : (step*7919 + 13);
  var avoid = opts.avoid || null;
  var broad = !!opts.broad;
  var d = { step:step, kind:kind, stage:stage, items:[], task:null, free:broad,
            disc: DISCOVERIES[step % DISCOVERIES.length], deferUsed:null };

  function setTask(st,ix){ d.task = TASKS[st][ix % TASKS[st].length]; d.taskRef = {s:st, i:ix % TASKS[st].length}; }
  function setRandomTask(sd){ var p = pickTask(stage, sd, avoid); setTask(p.s, p.i); }

  if(kind === "count"){
    if(broad){
      d.items = mixedWarm(step, opts.n || 8, seed, avoid);
    } else {
      var r = rng(seed), warm = [], seen = {}, g = 0;
      while(warm.length < 8 && g < 300){ g++; var w = WARMUP[stage](r); if(seen[w.q]) continue; seen[w.q]=1; warm.push(w); }
      d.items = warm;
    }
  }
  else if(kind === "geo"){
    d.items = pickN(broad ? poolUpTo(GEO, stage) : GEO[stage], opts.n || 6, seed + 101, avoid);
  }
  else if(kind === "logic"){
    d.items = pickN(broad ? poolUpTo(LOGIC, stage) : LOGIC[stage], opts.n || (broad ? 4 : 3), seed + 202, avoid);
  }
  else if(kind === "task"){
    if(broad){ d.items = []; setRandomTask(seed + 303); }
    else { d.items = mixedWarm(step, 2, seed + 303, avoid); setTask(stage, pos % TASKS[stage].length); }
  }
  else { /* mix — игровой день или свободная смесь */
    d.items = mixedWarm(step, 5, seed + 404, avoid);
    var r2 = rng(seed + 505);
    var g1 = pickN(broad ? poolUpTo(GEO, stage)   : GEO[Math.floor(r2()*(stage+1))],   1, seed + 511, avoid);
    var l1 = pickN(broad ? poolUpTo(LOGIC, stage) : LOGIC[Math.floor(r2()*(stage+1))], 1, seed + 522, avoid);
    d.items = d.items.concat(g1, l1);
    if(defer){ setTask(defer.s, defer.i); d.deferUsed = defer; }
    else setRandomTask(seed + 606);
  }
  return d;
}

/* ============================================================
   «КАРТОЧКИ»: уровни по 8 заданий, за уровень — карточка игрока,
   из карточек — состав по схеме.
   Ограничения в день нет. Ничего не сгорает: уровень засчитывается
   всегда, ошибка ведёт к подсказке и разбору.
   ============================================================ */
var LV_PER_STAGE = 10;
var LV_TOTAL = STAGES.length * LV_PER_STAGE;   /* 80 */
var ITEMS_PER_LV = 7;                          /* + задача = 8 заданий */

/* ---------- состояние ---------- */
var K_CORE = CFG.key + "_core", K_SEEN = CFG.key + "_seen", K_HIST = CFG.key + "_hist";
var cloud = (CFG.tg && TG && TG.CloudStorage && typeof TG.CloudStorage.getItems === "function") ? TG.CloudStorage : null;
var storageName = cloud ? "облако Telegram" : "память этого устройства";

function emptyCore(){
  return {v:1, lv:0, owned:[], form:"4-3-3", xi:{}, plays:0, me:null, rs:0, snd:true,
          agg:{items:0, first:0, tasks:0, ok:0, hint:0, shown:0}, hard:{}};
}
var CORE = emptyCore(), SEEN = [], HIST = [];

function normCore(c){
  if(!c || typeof c !== "object") return emptyCore();
  var e = emptyCore();
  for(var k in e) if(c[k] == null) c[k] = e[k];
  for(var a in e.agg) if(c.agg[a] == null) c.agg[a] = 0;
  syncMe(c);
  /* карточки, которых больше нет в базе, выбрасываем */
  c.owned = c.owned.filter(function(id){ return !!CARD_BY[id]; });
  return c;
}
function score(c){ return c.lv * 1000 + c.owned.length; }
function saveState(){
  var c = JSON.stringify(CORE);
  try{
    localStorage.setItem(K_CORE, c);
    localStorage.setItem(K_SEEN, JSON.stringify(SEEN.slice(-90)));
    localStorage.setItem(K_HIST, JSON.stringify(HIST.slice(-60)));
  }catch(e){}
  if(cloud){
    try{ cloud.setItem(K_CORE, c, function(){}); }catch(e){}
    cloudSetBig(K_HIST, JSON.stringify(HIST.slice(-60)));
  }
}

/* Облако Telegram: до 4096 символов на ключ. Большое (историю, фото своей карточки)
   режем на куски: <имя>_0, <имя>_1, … и <имя>_n — сколько кусков. */
var CHUNK = 4000;
function cloudSetBig(name, str, done){
  if(!cloud){ if(done) done(); return; }
  try{
    var n = str ? Math.ceil(str.length / CHUNK) : 0, left = n + 1;
    function one(){ if(--left === 0 && done) done(); }
    for(var i=0;i<n;i++) cloud.setItem(name+"_"+i, str.substr(i*CHUNK, CHUNK), one);
    cloud.setItem(name+"_n", String(n), one);
  }catch(e){ if(done) done(); }
}
function cloudGetBig(name, done){
  if(!cloud){ done(null); return; }
  try{
    cloud.getItems([name+"_n"], function(err, v){
      var n = (!err && v) ? parseInt(v[name+"_n"] || "0", 10) : 0;
      if(!n){ done(null); return; }

var DB_NAME = CFG.key + "_photos";
function idb(fn){
  try{
    var rq = indexedDB.open(DB_NAME, 1);
    rq.onupgradeneeded = function(){ rq.result.createObjectStore("p"); };
    rq.onsuccess = function(){ fn(rq.result); };
    rq.onerror = function(){ fn(null); };
  }catch(e){ fn(null); }
}
function loadPhotos(done){
  idb(function(db){
    if(!db){ done(); return; }
    try{
      var tx = db.transaction("p","readonly"), st = tx.objectStore("p"), cur = st.openCursor();
      cur.onsuccess = function(){
        var c = cur.result;
        if(c){ PHOTOS[c.key] = c.value; c.continue(); } else done();
      };
      cur.onerror = function(){ done(); };
    }catch(e){ done(); }
  });
}
function putPhoto(id, data, done){
  idb(function(db){
    if(!db){ done(false); return; }
    try{
      var tx = db.transaction("p","readwrite");
      if(data) tx.objectStore("p").put(data, id); else tx.objectStore("p").delete(id);
      tx.oncomplete = function(){
        if(data) PHOTOS[id] = data; else delete PHOTOS[id];
        /* фото своей карточки дублируем в облако Telegram — переживёт смену телефона */
        if(id === "me") cloudSetBig(K_MEPHOTO, data || "");
        done(true);
      };
      tx.onerror = function(){ done(false); };
    }catch(e){ done(false); }
  });
}
/* уменьшаем до 420 px по высоте, прозрачность сохраняем */
function shrinkImage(file, done){
  var fr = new FileReader();
  fr.onload = function(){
    var img = new Image();
    img.onload = function(){
      var k = Math.min(1, 420 / img.height), cv = document.createElement("canvas");
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      var out = cv.toDataURL("image/webp", 0.88);
      if(out.indexOf("data:image/webp") !== 0) out = cv.toDataURL("image/png");
      done(out);
    };
    img.onerror = function(){ done(null); };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---------- какая карточка выпадет ----------
   Случайная, без повторов. Чем дальше уровень, тем выше рейтинг.
   Первые одиннадцать гарантированно складываются в 4-3-3. */
var FIRST_XI = {gk:1, def:4, mid:3, fwd:3};
var RANKED = CARDS.slice().sort(function(a,b){ return a.ovr - b.ovr; });
function drawCard(level){
  var owned = {}, have = {gk:0,def:0,mid:0,fwd:0};
  CORE.owned.forEach(function(id){ owned[id] = 1; have[CARD_BY[id].line]++; });
  var pool = RANKED.filter(function(c){ return !owned[c.id]; });
  if(!pool.length) return null;
  /* самая первая карточка — игрок «Манчестер Юнайтед» */
  if(CORE.owned.filter(function(id){ return id !== "me"; }).length === 0){
    var mu = pool.filter(function(c){ return /Манчестер Юнайтед/.test(c.club) && c.line !== "gk"; });
    if(mu.length) return mu[Math.floor(Math.random()*mu.length)];
  }
  var left = 11 - CORE.owned.length;
  if(left > 0){
    var need = {}, sum = 0;
    for(var l in FIRST_XI){ need[l] = Math.max(0, FIRST_XI[l] - have[l]); sum += need[l]; }
    if(sum >= left){
      var only = pool.filter(function(c){ return need[c.line] > 0; });
      if(only.length) pool = only;
    }
  }
  var N = RANKED.length, target = (level / Math.max(1, LV_TOTAL-1)) * (N-1), spread = N * 0.2;
  var w = pool.map(function(c){
    var d = (RANKED.indexOf(c) - target) / spread;
    return Math.exp(-d*d) + 0.04;
  });
  var tot = w.reduce(function(a,b){ return a+b; }, 0), x = Math.random() * tot;
  for(var i=0;i<pool.length;i++){ x -= w[i]; if(x <= 0) return pool[i]; }
  return pool[pool.length-1];
}

/* ---------- уровень: 7 примеров/вопросов + задача ---------- */
function freshSeed(){ return ((Date.now() ^ Math.floor(Math.random()*0x7FFFFFFF)) >>> 0); }
function avoidMap(){ var m = {}; SEEN.forEach(function(q){ m[q] = 1; }); return m; }
function buildLevel(L, replay){
  var stage = Math.min(STAGES.length-1, Math.floor(L / LV_PER_STAGE)), k = L % LV_PER_STAGE;
  var seed = freshSeed(), r = rng(seed), avoid = avoidMap(), items = [], seen = {}, g = 0;
  while(items.length < 4 && g < 400){ g++;
    var w = WARMUP[stage](r); if(seen[w.q] || (avoid[w.q] && g < 200)) continue; seen[w.q] = 1; items.push(w); }
  g = 0;
  while(items.length < 5 && g < 200){ g++;
    var s = stage > 0 ? Math.floor(r()*stage) : 0, w2 = WARMUP[s](r);
    if(seen[w2.q]) continue; seen[w2.q] = 1; items.push(w2); }
  items = items.concat(pickN(GEO[stage], 1, seed + 101, avoid), pickN(LOGIC[stage], 1, seed + 202, avoid));
  var ti = replay ? Math.floor(r()*TASKS[stage].length) : (k % TASKS[stage].length);
  return {L:L, stage:stage, items:items, task:TASKS[stage][ti], replay:!!replay};
}

  function refreshNext(){ var n = document.getElementById("wNext"); if(n) n.disabled = !ok(); }
  /* выбранное «летит» в своё место на карточке, потом следующий шаг */
  function flyThenNext(fromEl, html){
    var w = WIZ[step], card = document.getElementById("wcard"), target = card && card.querySelector(w.fld);
    var done = false;
    function next(){ if(done) return; done = true; if(el && el.parentNode) el.parentNode.removeChild(el); popFld = w.fld; step++; draw(); }
    var el = null;
    if(!fromEl || !target || REDUCED || !document.body.animate){ next(); return; }
    var a = fromEl.getBoundingClientRect(), b = target.getBoundingClientRect();
    el = document.createElement("div"); el.className = "fly"; el.innerHTML = html; el.style.fontSize = "22px";
    document.body.appendChild(el);
    /* старт — из центра того, что выбрали */
    var x0 = a.left + a.width/2 - el.offsetWidth/2, y0 = a.top + a.height/2 - el.offsetHeight/2;
    el.style.left = x0 + "px"; el.style.top = y0 + "px";
    var dx = b.left + b.width/2 - (x0 + el.offsetWidth/2), dy = b.top + b.height/2 - (y0 + el.offsetHeight/2);

    var anim = el.animate([
      {transform:"translate(0,0) scale(1)", opacity:1},
      {transform:"translate("+dx*.5+"px,"+(dy*.5-60)+"px) scale(1.2)", opacity:1, offset:.5},
      {transform:"translate("+dx+"px,"+dy+"px) scale(.45)", opacity:.2}
    ], {duration:620, easing:"cubic-bezier(.4,0,.2,1)"});

    var cancel = document.getElementById("meCancel"); if(cancel) cancel.onclick = function(){ renderHome(); };

            nm.onkeydown = function(e){ if(e.key === "Enter" && ok()) document.getElementById("wNext").click(); };

        if(w.k === "nat"){ d.nat = v; ME_NATS.forEach(function(x){ if(x[0] === v) d.flag = x[1]; }); }
        Array.prototype.forEach.call(document.querySelectorAll(".wopt"), function(o){ o.classList.toggle("on", o === b); });
        if(w.k === "club" && !v){ draw(); var i = document.getElementById("meClub"); if(i) i.focus(); return; }

    ["meCam","meGal"].forEach(function(id){
      var inp = document.getElementById(id); if(!inp) return;
      inp.onchange = function(){
        var f = inp.files && inp.files[0]; if(!f) return;

      var src = document.querySelector(".wopt.on") || document.getElementById("meName") || document.getElementById("meClub") || nx;
      var txt = w.k === "n" ? esc(d.n.trim()) : w.k === "pos" ? POS_RU[d.pos] : w.k === "nat" ? d.flag : esc(clubShort(d.club));

/* ---------- праздник: конфетти, похвала, звук ----------
   Только за успех. За ошибку — ни звука, ни грустных картинок. */
var REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var PRAISE = ["Отлично!","Супер!","Точно!","Гол!","Красиво!","Так держать!","Есть!","Здорово!"];
var fx = null;
function fxCanvas(){
  if(fx && fx.cv.parentNode) return fx;
  var cv = document.createElement("canvas"); cv.id = "fx"; document.body.appendChild(cv);
  fx = {cv:cv, ctx:cv.getContext("2d"), parts:[], run:false};
  return fx;
}
function confetti(x, y, n, spread){
  if(REDUCED) return;
  var f = fxCanvas(), dpr = window.devicePixelRatio || 1;
  f.cv.width = innerWidth * dpr; f.cv.height = innerHeight * dpr; f.ctx.setTransform(dpr,0,0,dpr,0,0);
  var cols = ["#EFBF3F","#DA291C","#F2F5F9","#3FB27F","#5FA8FF"];
  for(var i=0;i<n;i++){
    var a = Math.random()*Math.PI*2, v = (spread||7) * (0.4 + Math.random());
    f.parts.push({x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 4, r:3+Math.random()*4, c:cols[i%cols.length],
                  rot:Math.random()*6, vr:(Math.random()-.5)*.4, life:60+Math.random()*30});
  }
  if(!f.run){ f.run = true; requestAnimationFrame(fxTick); }
}
function fxTick(){
  var f = fx, ctx = f.ctx; ctx.clearRect(0,0,innerWidth,innerHeight);
  f.parts = f.parts.filter(function(p){ return --p.life > 0 && p.y < innerHeight + 20; });
  f.parts.forEach(function(p){
    p.vy += .25; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.min(1, p.life/25);
    ctx.fillStyle = p.c; ctx.fillRect(-p.r, -p.r/2, p.r*2, p.r); ctx.restore();
  });
  if(f.parts.length) requestAnimationFrame(fxTick); else { f.run = false; ctx.clearRect(0,0,innerWidth,innerHeight); }
}
function fireworks(){
  if(REDUCED) return;
  [0,250,500,800].forEach(function(t, i){
    setTimeout(function(){ confetti(innerWidth*(.2+.6*Math.random()), innerHeight*(.18+.25*Math.random()), 60, 9); }, t);
  });
}
function praise(text){
  var el = document.createElement("div"); el.className = "praise";
  el.textContent = text || PRAISE[Math.floor(Math.random()*PRAISE.length)];

/* звук синтезируется на месте — никаких файлов */
var actx = null;
function audio(){
  if(!CORE.snd) return null;
  try{
    if(!actx){ var A = window.AudioContext || window.webkitAudioContext; if(!A) return null; actx = new A(); }
    if(actx.state === "suspended") actx.resume();
  }catch(e){ return null; }
  return actx;
}
function tone(freq, at, dur, vol, type){
  var a = audio(); if(!a) return;
  var o = a.createOscillator(), g = a.createGain(), t = a.currentTime + at;
  o.type = type || "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || .18, t + .02);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + .05);
}

  var head = run.ii < 5 ? "Разминка" : (run.ii === 5 ? "Разметка поля" : "Тактическая доска");
  var inner = stripHTML(run.ii) + '<div class="phase">'+head+'</div>';
  if(it.c) inner += '<div class="board"><p class="ctx">'+esc(it.c)+'</p><div class="expr">'+esc(it.q)+'</div></div>';
  else inner += '<p class="qtext">'+esc(it.q)+'</p>';
  inner += '<div class="answer empty" id="ans"></div><p class="msg" id="msg"></p>';
  app.innerHTML = shell(inner, numpad());
  bindPad(checkItem);
}
function checkItem(){
  if(!run || run.locked || run.input === "") return;
  var it = run.lv.items[run.ii];
  if(parseInt(run.input,10) === it.a){
    if(run.tries === 0) run.first++;
    run.locked = true; if(CFG.tg) haptic("ok"); say("есть!", true);
    run.done++; paintBar(); celebrate(document.getElementById("ans")); nextItem(900);
  } else {
    run.tries++; if(CFG.tg) haptic("no"); shakeAnswer();
    if(run.tries === 1){ say("мимо — попробуй ещё раз"); run.input = ""; paintAnswer(); }
    else { run.locked = true; if(run.hard.indexOf(it.t) < 0) run.hard.push(it.t); say("правильный ответ: "+it.a);
           run.done++; paintBar(); nextItem(2200); }
  }
}
function nextItem(delay){
  moveBall(run.ii + 1);
  setTimeout(function(){
    if(!run) return;
    run.ii++; run.tries = 0; run.input = "";
    if(run.ii >= run.lv.items.length) renderTask(); else renderItem();
  }, delay);
}
function renderTask(showHint, showSol){
  var t = run.lv.task;
  var inner = stripHTML(total()-1) + '<div class="phase">Разбор матча · задача</div><p class="qtext">'+esc(t.q)+'</p>';
  if(!showSol){
    inner += '<div class="answer empty" id="ans"></div><p class="msg" id="msg"></p>';
    if(showHint) inner += '<div class="hintbox"><b>Подсказка.</b> '+esc(t.h)+'</div>';
    app.innerHTML = shell(inner, numpad());
    bindPad(checkTask);
  } else {
    inner += '<div class="hintbox"><b>Как это решается.</b> '+esc(t.s)+'</div><p class="msg" id="msg">хитрая была задача — теперь ты знаешь, как её решать</p>';
    app.innerHTML = shell(inner, '');
    document.getElementById("quitBtn").onclick = quitLevel;
    document.onkeydown = null;
    var b = document.createElement("button"); b.className = "contbtn"; b.textContent = "Понятно, дальше";
    b.onclick = function(){ tap(); run.done++; paintBar(); goal(); };
    document.querySelector(".sessbody").appendChild(b);
    paintBar();
  }
}
function checkTask(){
  if(!run || run.locked || run.input === "") return;
  var t = run.lv.task;
  if(parseInt(run.input,10) === t.a){
    run.taskResult = run.taskTries < 2 ? "ok" : "hint"; run.locked = true;
    if(CFG.tg) haptic("ok"); say("верно!", true); run.done++; paintBar(); celebrate(document.getElementById("ans"), "Верно!");
    setTimeout(function(){ if(run) goal(); }, 800); return;
  }
  run.taskTries++; if(CFG.tg) haptic("no"); shakeAnswer(); run.input = "";
  if(run.taskTries === 1){ renderTask(false,false); say("пока не сходится — подумай ещё"); }
  else if(run.taskTries === 2){ renderTask(true,false); say("вот подсказка"); }
  else { run.taskResult = "shown"; renderTask(false,true); }
}
function goal(){
  run.locked = true; document.onkeydown = null;
  var pad = document.querySelector(".pad"); if(pad) pad.style.pointerEvents = "none";
  var el = document.getElementById("strip");
  if(el){ var b = el.querySelector(".ball"); if(b) b.style.bottom = "93%"; el.classList.add("scored"); }
  if(CFG.tg) haptic("ok");
  fireworks(); sndWin();
  setTimeout(function(){ if(run) finishLevel(); }, 1700);
}

function finishLevel(){
  var lv = run.lv, newCard = null;
  CORE.plays++;
  CORE.agg.items += lv.items.length; CORE.agg.first += run.first; CORE.agg.tasks++;
  CORE.agg[run.taskResult || "shown"]++;
  run.hard.forEach(function(t){ CORE.hard[t] = (CORE.hard[t]||0) + 1; });
  lv.items.forEach(function(it){ SEEN.push(it.q); }); SEEN.push(lv.task.q);
  if(!lv.replay && lv.L === CORE.lv){
    CORE.lv++; syncMe();
    newCard = drawCard(lv.L);
    if(newCard) CORE.owned.push(newCard.id);
  }
  var d = new Date();
  HIST.push({d:d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(), L:lv.L+1, ft:run.first, n:lv.items.length,
             tr:run.taskResult, c:newCard ? newCard.id : null});
  saveState();
  if(CFG.tg){ guardClose(false); setBack(null); }
  var L = lv.L;
  run = null;
  if(newCard) renderPack(newCard, L); else renderReplayDone(L);
}
function renderPack(c, L){
  var h = '<div class="sess"><div class="sessbody"><div class="reveal">'+
          (c.me ? '<h2>Твоя карточка готова!</h2><p class="sub">Открывай пак.</p>'
                : '<h2>Уровень '+(L+1)+' пройден!</h2><p class="sub">Тебе выпал пак. Открывай!</p>')+
          '<div class="pack" id="pack"><b>?</b><span>нажми</span></div></div></div></div>';
  app.innerHTML = h;
  document.getElementById("pack").onclick = function(){
    var p = this, r = p.getBoundingClientRect(); p.classList.add("open"); if(CFG.tg) haptic("ok");
    sndPack(); confetti(r.left + r.width/2, r.top + r.height/2, 90, 11);
    setTimeout(function(){ showReveal(c, L); }, 430);
  };
}
function showReveal(c, L){
  var t = tierOf(c), n = CORE.owned.length;
  var h = '<div class="sess"><div class="sessbody"><div class="reveal">'+
          '<div class="cardin glow-'+t+'">'+cardHTML(c, false)+'</div>'+
          '<p class="tierword">'+(c.me ? 'Моя карточка' : TIER_WORD[t])+' · '+LINE_WORD[c.line]+'</p>'+
          '<h2>'+esc(c.n)+'</h2><p class="cvc" style="color:var(--grey-2);margin:0;font-size:13px">'+esc(c.club)+' · '+esc(c.nat)+'</p>'+
          '<p class="fact">'+esc(c.f)+'</p>'+
          (c.me ? '<p class="sub" style="margin-top:8px">Это первая карточка в твоей коллекции. Проходи уровни — '+
                   'будут новые игроки, а твой рейтинг будет расти.</p>' :
          '<p class="sub" style="margin-top:8px">В коллекции '+n+' '+plural(n,"карточка","карточки","карточек")+
          (n === 11 ? ' — хватает на целый состав!' : '')+'</p>')+
          (CORE.lv < LV_TOTAL ? '<button class="contbtn" id="next">Уровень '+(CORE.lv+1)+'</button>' : '')+
          '<button class="contbtn ghost" id="toxi">'+(n >= 11 ? 'Собрать состав' : 'В коллекцию')+'</button>'+
          '</div></div></div>';
  app.innerHTML = h;
  var nx = document.getElementById("next"); if(nx) nx.onclick = function(){ tap(); startLevel(CORE.lv); };
  document.getElementById("toxi").onclick = function(){ tap(); tab = n >= 11 ? "xi" : "coll"; renderHome(); };
}
function renderReplayDone(L){
  var h = '<div class="sess"><div class="sessbody"><div class="reveal">'+
          '<div class="matchbadge"><span class="mn">'+(L+1)+'</span><span class="ml">уровень</span></div>'+
          '<h2>Тренировка сыграна</h2><p class="sub">'+(L < CORE.lv && CORE.lv <= LV_TOTAL && CORE.owned.length < CARDS.length ?
            'Новые карточки — за новые уровни.' : 'Отличная тренировка.')+'</p>'+
          (CORE.lv < LV_TOTAL ? '<button class="contbtn" id="next">Уровень '+(CORE.lv+1)+'</button>' : '')+
          '<button class="contbtn ghost" id="home">На главную</button></div></div></div>';
  app.innerHTML = h;
  var nx = document.getElementById("next"); if(nx) nx.onclick = function(){ tap(); startLevel(CORE.lv); };
  document.getElementById("home").onclick = function(){ tap(); renderHome(); };
}

/* ---------- родителю ---------- */
var CODE = "1107";
function bindParentGate(el){
  if(!el) return;
  var t = null;
  function down(e){ t = setTimeout(askCode, 1200); }
  function up(){ clearTimeout(t); }
  el.addEventListener("pointerdown", down); el.addEventListener("pointerup", up); el.addEventListener("pointerleave", up);
}
function askCode(){
  var d = document.createElement("div"); d.className = "parent";
  d.innerHTML = '<div class="wrap"><div class="pcode"><p>Код для родителей</p><input id="pc" inputmode="numeric" maxlength="4" autocomplete="off">'+
                '<button class="contbtn ghost" id="pcx">Отмена</button></div></div>';
  document.body.appendChild(d);
  var inp = document.getElementById("pc"); inp.focus();
  inp.oninput = function(){ if(inp.value === CODE){ document.body.removeChild(d); renderParent(); } };
  document.getElementById("pcx").onclick = function(){ document.body.removeChild(d); };
}
function renderParent(){
  var a = CORE.agg, pct = a.items ? Math.round(a.first*100/a.items) : 0;
  var h = '<div class="wrap"><div class="ptop"><h2>Родителю</h2><button class="pclose" id="pClose">Закрыть</button></div>';
  h += '<div class="pstats">'+
       '<div class="pstat"><b>'+CORE.lv+'</b><span>уровней из '+LV_TOTAL+'</span></div>'+
       '<div class="pstat"><b>'+CORE.plays+'</b><span>сыграно всего, с повторами</span></div>'+
       '<div class="pstat"><b>'+pct+'%</b><span>примеров с первой попытки</span></div>'+
       '<div class="pstat"><b>'+a.ok+' / '+a.tasks+'</b><span>задач без подсказки</span></div></div>';
  var hard = Object.keys(CORE.hard).sort(function(x,y){ return CORE.hard[y]-CORE.hard[x]; }).slice(0,6);
  if(hard.length){
    h += '<div class="phead">Темы с ошибками</div>';
    hard.forEach(function(t){ h += '<div class="prow"><span class="pd">'+CORE.hard[t]+'×</span><span class="pt">'+esc(t)+'</span><span></span></div>'; });
  }
  if(HIST.length){
    h += '<div class="phead">Последние уровни</div>';
    HIST.slice(-10).reverse().forEach(function(x){
      var c = x.c && CARD_BY[x.c];
      h += '<div class="prow"><span class="pd">'+esc(x.d)+'</span><span class="pt">Уровень '+x.L+' · '+x.ft+' из '+x.n+' с первой'+
           (c ? '<i>карточка: '+esc(c.n)+'</i>' : '<i>тренировка</i>')+'</span>'+
           '<span class="pill '+(x.tr||'shown')+'">'+({ok:"задача сама",hint:"с подсказкой",shown:"разобрали"})[x.tr||"shown"]+'</span></div>';
    });
  }
  h += '<div class="phead">Фото игроков</div><p class="psync" style="border:0;margin-top:0;padding-top:0">'+
       'Встроены свободные фото из Wikimedia Commons. Своё фото заменяет встроенное и хранится только на этом устройстве. '+
       'Лучше всего — вырезанная фигура без фона (PNG), как в FIFA.</p>';
  CARDS.slice().sort(function(x,y){ return y.ovr - x.ovr; }).forEach(function(c){
    var ph = photoOf(c.id), cr = PHOTO_CREDITS[c.id];
    h += '<div class="prow2"><div class="th">'+(ph ? '<img alt="" src="'+ph+'">' : 'нет')+'</div>'+
         '<div>'+esc(c.n)+'<i>'+c.ovr+' · '+esc(c.club)+(CORE.owned.indexOf(c.id)>=0 ? ' · есть в коллекции' : '')+'</i>'+
         (PHOTOS[c.id] ? '<i>своё фото</i>' : (cr ? '<i>фото: '+esc(cr.a)+', '+esc(cr.l)+'</i>' : ''))+'</div>'+
         '<div class="acts"><label>фото<input type="file" accept="image/*" data-id="'+c.id+'" hidden></label>'+
         (PHOTOS[c.id] ? '<button data-del="'+c.id+'">✕</button>' : '')+'</div></div>';
  });
  h += '<p class="psync">Авторы встроенных фото указаны под каждым игроком; снимки взяты из Wikimedia Commons '+
       'по свободным лицензиям (CC BY, CC BY-SA, CC0, общественное достояние), обрезаны и очищены от фона.</p>';
  h += '<div class="pbtns"><button class="pbtn" id="editMe">Изменить карточку '+esc(CORE.me ? CORE.me.n : "")+'</button>'+
       '<button class="pbtn" id="copyData">Скопировать данные</button>'+
       '<button class="pbtn" id="resetAll">Начать заново</button>'+
       '<button class="pbtn" id="wipeAll">Стереть всё</button></div>'+
       '<p class="psync" style="border:0;margin-top:8px;padding-top:0">«Начать заново» стирает уровни и карточки, '+
       'но оставляет карточку '+esc(CORE.me ? CORE.me.n : "ребёнка")+'. «Стереть всё» удаляет и её вместе с фото — '+
       'приложение откроется как в первый раз.</p>';
  h += '<p class="psync">Прогресс хранится в '+esc(storageName)+'. Ограничения на число уровней в день нет: '+
       'за каждый новый уровень — одна карточка, переигрывать пройденные можно сколько угодно.<br><br>'+
       'Код входа: 1107, долгое нажатие на заголовок.</p></div>';
  var d = document.createElement("div"); d.className = "parent"; d.innerHTML = h;
  document.body.appendChild(d);
  function reopen(){ var y = d.scrollTop; document.body.removeChild(d); renderParent();
    var nd = document.querySelector(".parent"); if(nd) nd.scrollTop = y; }
  document.getElementById("pClose").onclick = function(){ document.body.removeChild(d); renderHome(); };
  Array.prototype.forEach.call(d.querySelectorAll("input[type=file]"), function(inp){
    inp.onchange = function(){
      var f = inp.files && inp.files[0]; if(!f) return;
      shrinkImage(f, function(data){ if(data) putPhoto(inp.getAttribute("data-id"), data, reopen); });
    };
  });
  Array.prototype.forEach.call(d.querySelectorAll("button[data-del]"), function(b){
    b.onclick = function(){ putPhoto(b.getAttribute("data-del"), null, reopen); };
  });
  document.getElementById("editMe").onclick = function(){ document.body.removeChild(d); renderMeForm(true); };
  document.getElementById("copyData").onclick = function(){
    var txt = JSON.stringify({core:CORE, hist:HIST});
    var btn = this;
    try{ navigator.clipboard.writeText(txt).then(function(){ btn.textContent = "скопировано"; }, function(){ btn.textContent = "не удалось скопировать"; }); }
    catch(e){ btn.textContent = "не удалось скопировать"; }
  };
  /* подтверждение — повторным нажатием: confirm() в артефакте не показывается */
  var armed = false;
  document.getElementById("resetAll").onclick = function(){
    if(!armed){ armed = true; this.textContent = "Точно стереть уровни и карточки? Нажми ещё раз"; return; }
    var me = CORE.me;   /* своя карточка остаётся */
    CORE = emptyCore(); CORE.me = me; if(me) CORE.owned = ["me"]; syncMe();
    SEEN = []; HIST = []; saveState();
    document.body.removeChild(d); tab = "levels"; renderHome();
  };
  var armed2 = false;
  document.getElementById("wipeAll").onclick = function(){
    if(!armed2){ armed2 = true; this.textContent = "Стереть всё, включая карточку и фото? Нажми ещё раз"; return; }
    CORE = emptyCore(); CORE.rs = Date.now(); syncMe();
    SEEN = []; HIST = []; saveState();
    putPhoto("me", null, function(){ document.body.removeChild(d); tab = "levels"; renderHome(); });
  };
}

/* для автоматических проверок: текущий ответ и состояние */
window.__karty = {
  answer: function(){ return !run ? null : (run.ii < run.lv.items.length ? run.lv.items[run.ii].a : run.lv.task.a); },
  core: function(){ return CORE; },
  hist: function(){ return HIST; }
};

/* фото своей карточки: если на устройстве нет, а в облаке есть — достаём и кладём на устройство */
function restoreMePhoto(done){
  if(PHOTOS.me || !cloud){ done(); return; }
  cloudGetBig(K_MEPHOTO, function(data){
    if(data && data.indexOf("data:image/") === 0){
      PHOTOS.me = data;
      idb(function(db){ try{ if(db) db.transaction("p","readwrite").objectStore("p").put(data, "me"); }catch(e){} done(); });
    } else done();
  });
}

/* загрузочный экран (рисуется в HTML до скрипта) уходит, когда готовы данные и шрифты */
var T0 = Date.now();
function hideSplash(){
  var sp = document.getElementById("splash"); if(!sp) return;
  var fonts = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  var cap = new Promise(function(r){ setTimeout(r, 2500); });
  Promise.race([fonts, cap]).then(function(){
    setTimeout(function(){
      sp.classList.add("done");
      setTimeout(function(){ sp.classList.add("out"); setTimeout(function(){ if(sp.parentNode) sp.parentNode.removeChild(sp); }, 400); }, 250);
    }, Math.max(0, 900 - (Date.now() - T0)));
  });
}

loadState(function(){ loadPhotos(function(){ restoreMePhoto(function(){ renderHome(); hideSplash(); }); }); });

})();
</script>
